<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LifeLine AI</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<header class="header">
    <div class="logo">
        <i class="fas fa-heartbeat"></i>
        <h1>LifeLine AI</h1>
    </div>
    <div class="status">
        <span class="live-indicator"></span>
        <span>LIVE</span>
    </div>
</header>

<div class="container">
<div class="dashboard-grid">

<div class="card">
<h3><i class="fas fa-ambulance"></i> Active Ambulances</h3>
<div id="ambulance-list"></div>

<button id="emergency-btn" class="emergency-btn">
🚨 New Emergency
</button>
</div>

<div class="card">
<h3><i class="fas fa-traffic-light"></i> Smart Signals</h3>
<div id="traffic-list"></div>
</div>

<div class="card">
<h3><i class="fas fa-brain"></i> AI Route Prediction</h3>
<div class="ai-prediction">Analyzing routes...</div>
</div>

<div class="card map-card">
<h3><i class="fas fa-map-marker-alt"></i> Live Map</h3>

<iframe id="mapFrame" src="/map.html"></iframe>

</div>

<div class="card">
<h3><i class="fas fa-hospital"></i> Hospital Alerts</h3>
<div>Waiting for emergency...</div>
</div>

<div class="card">
<h3><i class="fas fa-car"></i> Driver Alerts</h3>
<div class="notification">🚨 Ambulance approaching</div>
</div>

</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map = L.map("map").setView([13.0827, 80.2707], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let routeLine, userMarker, hospitalMarker;

window.addEventListener("message", (event) => {
    console.log("📩 FROM APP:", event.data);
    if (event.data.type === "START") {
        startRouting();
    }
});

async function startRouting() {

navigator.geolocation.getCurrentPosition(async (pos) => {

const user = [pos.coords.latitude, pos.coords.longitude];

// nearest hospital
const res = await fetch(`https://overpass-api.de/api/interpreter?data=
[out:json];
node["amenity"="hospital"](around:3000,${user[0]},${user[1]});
out;`);

const data = await res.json();

if (!data.elements.length) {
    alert("No hospital found");
    return;
}

const hospital = [
    data.elements[0].lat,
    data.elements[0].lon
];

// clear
if (routeLine) map.removeLayer(routeLine);
if (userMarker) map.removeLayer(userMarker);
if (hospitalMarker) map.removeLayer(hospitalMarker);

// markers
userMarker = L.marker(user).addTo(map).bindPopup("You").openPopup();
hospitalMarker = L.marker(hospital).addTo(map).bindPopup("Hospital");

// real route
const routeRes = await fetch(
`https://router.project-osrm.org/route/v1/driving/${user[1]},${user[0]};${hospital[1]},${hospital[0]}?overview=full&geometries=geojson`
);

const routeData = await routeRes.json();

const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

routeLine = L.polyline(coords, { color: "red", weight: 5 }).addTo(map);

map.fitBounds(routeLine.getBounds());

}, () => {
    alert("Allow location access");
});
}
</script>

</body>
</html>
